backend:
  name: github
  repo: clayton63/QuartzReport
  branch: main

  # Auth GitHub via les variables Netlify
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Auteur", name: "author", widget: "string", default: "Clément Lamps" }
      - { label: "Résumé", name: "description", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }
      - { label: "Image de couverture", name: "thumbnail", widget: "image" }
