backend:
  name: github
  repo: Clayton630/QuartzReport
  branch: main
  base_url: https://quartzreport-oauth.claytonelhorga.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Auteur", name: "author", widget: "string", default: "Clayton" }
      - { label: "Résumé", name: "description", widget: "text" }
      # ✅ Editeur markdown avec support des images inline
      - label: "Contenu"
        name: "body"
        widget: "markdown"
        editor_components: ["image"]
      - { label: "Image de couverture", name: "thumbnail", widget: "image", required: false }
      - { label: "Important", name: "important", widget: "boolean", default: false }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Apple", "Comparatif", "Review", "Analyse", "Autre"] }
