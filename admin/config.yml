backend:
  name: github
  repo: Clayton630/QuartzReport   # ton repo GitHub
  branch: main

media_folder: "img/uploads"       # où les images seront stockées dans ton repo
public_folder: "/img/uploads"     # chemin public pour ton site

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Auteur", name: "author", widget: "string", default: "Clayton" }
      - { label: "Résumé", name: "description", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }
      - { label: "Image de couverture", name: "thumbnail", widget: "image" }
