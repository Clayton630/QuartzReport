<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Quartz Report – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <!-- Point de montage obligatoire -->
  <div id="nc-root"></div>

  <!-- Script Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>

  <!-- Enregistrement explicite du backend GitHub -->
  <script>
    if (window.CMS_BACKENDS && window.CMS_BACKENDS.github) {
      CMS.registerBackend("github", window.CMS_BACKENDS.github);
      console.log("✅ Backend GitHub enregistré avec succès");
    } else {
      console.error("❌ Backend GitHub introuvable dans CMS_BACKENDS");
    }
  </script>
</body>
</html>
