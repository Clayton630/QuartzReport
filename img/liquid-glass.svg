<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="liquid-glass" x="0" y="0" width="100%" height="100%">
    <!-- Génère un bruit fractal -->
    <feTurbulence
      id="turb"
      type="fractalNoise"
      baseFrequency="0.03"
      numOctaves="2"
      seed="2"
      result="noise"
    />
    <!-- Déplacement basé sur ce bruit -->
    <feDisplacementMap
      in="SourceGraphic"
      in2="noise"
      scale="12"
      xChannelSelector="R"
      yChannelSelector="G"
    />
    <!-- Animation fluide -->
    <animate
      xlink:href="#turb"
      attributeName="baseFrequency"
      dur="8s"
      values="0.03;0.04;0.03"
      repeatCount="indefinite"
    />
  </filter>
</svg>
