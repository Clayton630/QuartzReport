<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz Report</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons/css/framework7-icons.css">
</head>
<body>

  <!-- Header -->
<header class="site-header">
  <div class="logo">
    <img src="img/logo.svg" alt="Quartz Report" class="logo-img">
  </div>
  <div class="icons">
    <i class="f7-icons">search</i>
    <i class="f7-icons">menu</i>
  </div>
</header>

  <!-- Navigation (catégories dynamiques) -->
  <nav class="main-nav">
    <ul id="categories"></ul>
  </nav>

  <!-- Section Hottest -->
  <section class="hottest">
    <h2>Hottest :</h2>
    <div class="hottest-wrapper">
      <div class="hottest-grid" id="hottest"></div>
    </div>
  </section>

  <!-- Section Articles récents -->
  <section class="articles" id="articles"></section>

  <!-- ✅ Ajout de marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Ton script -->
  <script src="js/script.js"></script>
</body>
</html>
