<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuartzReport</title>
  <meta name="description" content="QuartzReport : actualités, analyses, tests et comparatifs.">
  <meta property="og:site_name" content="Quartz Report">
  <meta property="og:type" content="website">
  <meta property="og:title" content="QuartzReport">
  <meta property="og:description" content="Actualités, analyses, tests et comparatifs.">

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons/css/framework7-icons.css">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <div class="logo">
      <img src="img/logo.svg" alt="Quartz Report" class="logo-img">
    </div>

    <div class="icons unified-btn">
      <button class="dual-icon-btn">
        <i class="f7-icons search-icon">search</i>
        <i class="f7-icons menu-icon">menu</i>
      </button>
    </div>
  </header>

  <!-- Navigation (catégories dynamiques) -->
  <nav class="main-nav">
    <ul id="categories"></ul>
  </nav>

  <!-- Section Hottest -->
  <section class="hottest">
    <div class="hottest-wrapper">
      <div class="hottest-grid" id="hottest"></div>
    </div>
  </section>

  <!-- Titre "Tous les articles" -->
  <h2 class="all-articles-title">Tous les articles</h2>

  <!-- Section Articles récents -->
  <section class="articles" id="articles"></section>

  <!-- Script principal -->
  <script src="js/script.js"></script>
</body>
</html>
