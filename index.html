<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QuartzReport</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons/css/framework7-icons.css">

  <!-- ✅ Couleur et intégration iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f3f6fb">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <div class="logo">
      <img src="img/logo.svg" alt="Quartz Report" class="logo-img">
    </div>
    <div class="icons unified-btn">
  <button class="dual-icon-btn">
    <i class="f7-icons search-icon">search</i>
    <i class="f7-icons menu-icon">menu</i>
  </button>
</div>
  </header>

  <!-- Navigation (catégories dynamiques) -->
  <nav class="main-nav">
    <ul id="categories"></ul>
  </nav>

  <!-- Section Hottest -->
<section class="hottest">
  <div class="hottest-wrapper">
    <div class="hottest-grid" id="hottest"></div>
  </div>
</section>

<!-- ✅ Ajout du titre "Tous les articles" -->
<h2 class="all-articles-title">Tous les articles</h2>

  <!-- Section Articles récents -->
  <section class="articles" id="articles"></section>

  <!-- Librairie de rendu Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Ton script principal (corrigé) -->
  <script src="js/script.js"></script>
</body>
</html>
