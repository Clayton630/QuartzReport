<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="logo">Quartz<span>Report</span></div>
    <div class="icons">
      <button class="search-btn">🔍</button>
      <button class="menu-btn">☰</button>
    </div>
  </header>

  <!-- Navigation (catégories dynamiques) -->
  <nav class="main-nav">
    <ul id="categories"></ul>
  </nav>

  <!-- Section Hottest -->
  <section class="hottest">
    <h2>Hottest :</h2>
    <div class="hottest-wrapper">
      <div class="hottest-grid" id="hottest"></div>
    </div>
  </section>

  <!-- Section Articles récents -->
  <section class="articles" id="articles"></section>

  <!-- ✅ Ajout de marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Ton script -->
  <script src="js/script.js"></script>
</body>
</html>
