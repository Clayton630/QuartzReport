<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="logo">Quartz<span>Report</span></div>
    <div class="icons">
      <button class="search-btn">🔍</button>
      <button class="menu-btn">☰</button>
    </div>
  </header>

  <!-- Navigation (catégories) -->
  <nav class="main-nav">
    <ul>
      <li><a href="#">Catégorie 1</a></li>
      <li><a href="#">Catégorie 2</a></li>
      <li><a href="#">Catégorie 3</a></li>
      <li><a href="#">Catégorie 4</a></li>
    </ul>
  </nav>

  <!-- Section Hottest -->
  <section class="hottest">
    <h2>Hottest :</h2>
    <div class="hottest-grid">
      <article class="card">
        <img src="img/article1.jpg" alt="">
        <h3 id="hottest-title">Ceci est le titre d’un article très important</h3>
      </article>
      <article class="card">
        <img src="img/article2.jpg" alt="">
        <h3>Ceci est le titre d’un autre article important</h3>
      </article>
    </div>
  </section>

  <!-- Section Articles récents -->
  <section class="articles" id="articles">
    <!-- Les blocs seront générés automatiquement -->
  </section>

  <!-- JS -->
  <script src="js/script.js"></script>
</body>
</html>
