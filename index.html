<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QuartzReport</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons/css/framework7-icons.css">

  <!-- ✅ Couleur et intégration iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4b73fa">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <div class="logo">
      <img src="img/logo.svg" alt="Quartz Report" class="logo-img">
    </div>
    <div class="icons">
      <i class="f7-icons">search</i>
      <i class="f7-icons">menu</i>
    </div>
  </header>

  <!-- Navigation (catégories dynamiques) -->
  <nav class="main-nav">
    <ul id="categories"></ul>
  </nav>

  <!-- Section Hottest -->
  <section class="hottest">
    <h2>Hottest :</h2>
    <div class="hottest-wrapper">
      <div class="hottest-grid" id="hottest"></div>
    </div>
  </section>

  <!-- Section Articles récents -->
  <section class="articles" id="articles"></section>

  <!-- Librairie de rendu Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Ton script principal (corrigé) -->
  <script src="js/script.js"></script>
</body>
</html>
