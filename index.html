<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="logo">Quartz<span>Report</span></div>
    <div class="icons">
      <button class="search-btn">🔍</button>
      <button class="menu-btn">☰</button>
    </div>
  </header>

  <!-- Navigation (catégories dynamiques) -->
  <nav class="main-nav">
    <ul id="categories">
      <!-- Catégories générées dynamiquement -->
    </ul>
  </nav>

  <!-- Section Hottest (articles importants) -->
  <section class="hottest">
    <h2>Hottest :</h2>
    <div class="hottest-wrapper">
      <div class="hottest-grid" id="hottest">
        <!-- Articles importants insérés ici -->
      </div>
    </div>
  </section>

  <!-- Section Articles récents -->
  <section class="articles" id="articles">
    <!-- Les blocs seront générés automatiquement -->
  </section>

  <!-- JS -->
  <script src="js/script.js"></script>
</body>
</html>
